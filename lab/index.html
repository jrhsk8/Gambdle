<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gambdle · UI Lab</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #1b1b1b; color: #ccc; font-family: monospace; }
    body { display: flex; flex-direction: column; }
    #bar {
      display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center;
      padding: 8px 12px; background: #232323; border-bottom: 1px solid #333; flex: 0 0 auto;
    }
    #bar label { font-size: 11px; color: #888; display: flex; gap: 5px; align-items: center; }
    #bar select, #bar input {
      background: #2c2c2c; color: #ddd; border: 1px solid #3a3a3a; border-radius: 3px;
      font: 12px monospace; padding: 3px 5px;
    }
    #bar input.wh { width: 58px; }
    #bar .brand { color: #c49341; font-weight: bold; letter-spacing: .06em; margin-right: 4px; }
    #bar .spacer { flex: 1; }
    #bar .hint { font-size: 10px; color: #666; }
    #custom.hidden { display: none; }
    #stage {
      flex: 1; overflow: auto; padding: 18px;
      /* checkerboard so the felt window edges are visible against the stage */
      background:
        linear-gradient(45deg, #1f1f1f 25%, transparent 25%, transparent 75%, #1f1f1f 75%) 0 0 / 24px 24px,
        linear-gradient(45deg, #1f1f1f 25%, #181818 25%, #181818 75%, #1f1f1f 75%) 12px 12px / 24px 24px;
    }
    /* Single-frame stage: a sized box holding a transform-scaled iframe (media queries see W). */
    .frame-box { position: relative; margin: 0 auto; box-shadow: 0 6px 30px rgba(0,0,0,.5); background: #2a4a3a; }
    .frame-box iframe { border: 0; display: block; transform-origin: top left; }
    .size-tag { position: absolute; top: -16px; left: 0; font-size: 10px; color: #777; }
    /* Gallery grid */
    #gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 22px 14px; }
    /* All-sizes view: fit every binding size into the visible stage with no scrolling, as large as
       possible. The column count + cell size are computed in JS (grid-template-columns set inline);
       frames are centered in their cells since aspect ratios vary. */
    #gallery.fit { display: grid; gap: 16px; align-content: start; justify-items: center; }
    #gallery.fit .cap { text-align: center; }
    #gallery.fit .frame-box { margin: 0 auto; }
    .cell { }
    .cell .cap { font-size: 11px; color: #9a9; margin: 0 0 4px; }
    .cell .frame-box { margin: 0; }
  </style>
</head>
<body>
  <div id="bar">
    <span class="brand">♣ UI Lab</span>
    <label>Screen <select id="sel-screen"></select></label>
    <label>Size <select id="sel-size"></select></label>
    <span id="custom" class="hidden">
      <input class="wh" id="cw" type="number" min="240" placeholder="W"> ×
      <input class="wh" id="ch" type="number" min="320" placeholder="H">
    </span>
    <label>Modifier <select id="sel-mod"></select></label>
    <label title="Every Screen at the chosen size"><input type="checkbox" id="cb-gallery"> Gallery</label>
    <label title="This Screen at every binding size"><input type="checkbox" id="cb-sizes"> All sizes</label>
    <span class="spacer"></span>
    <span class="hint">live-reloads on styles.css / src/ edits</span>
  </div>
  <div id="stage"></div>

  <!-- Populate the dropdowns from the real registry + modifier presets. Relative paths (../) so the
       lab works both served (npm run lab) and opened directly via file://. These define globals only;
       their setup()/render() closures aren't invoked here (the iframe runs the game). -->
  <script src="../src/modifiers.js"></script>
  <script src="../tests/harness/screen-fixtures.js"></script>

  <script>
    const SIZES = ['360x780', '375x812', '393x852', '1024x1080', '1280x800', '1440x900', '1920x1080', '2560x1440', '3840x2160'];
    const $ = id => document.getElementById(id);
    const screenSel = $('sel-screen'), sizeSel = $('sel-size'), modSel = $('sel-mod'),
          galleryCb = $('cb-gallery'), sizesCb = $('cb-sizes'),
          custom = $('custom'), cw = $('cw'), ch = $('ch'), stage = $('stage');

    // If the registry / preset scripts didn't load, say so clearly instead of showing an empty UI.
    if (typeof SCREEN_FIXTURES === 'undefined' || typeof PRESET_MODIFIERS === 'undefined') {
      stage.innerHTML = '<div style="color:#e89; padding:32px; font:13px monospace; line-height:1.7; max-width:560px">'
        + '⚠ <b>The lab scripts did not load.</b><br>'
        + 'Run <b style="color:#c49341">npm run lab</b> and open the URL it prints '
        + '(<b>http://localhost:5180/</b>), or open <b>lab/index.html</b> directly from the repo.<br>'
        + '<span style="color:#888">(If you opened it from outside the repo folder, the relative paths to '
        + 'src/ and tests/ can\'t resolve.)</span></div>';
      throw new Error('UI Lab: SCREEN_FIXTURES / PRESET_MODIFIERS failed to load');
    }

    // ── Build dropdowns ──────────────────────────────────────────────────────
    // Screens grouped by their registry `group` label.
    const byGroup = {};
    for (const [name, fx] of Object.entries(SCREEN_FIXTURES)) (byGroup[fx.group || 'Other'] ||= []).push(name);
    for (const [group, names] of Object.entries(byGroup)) {
      const og = document.createElement('optgroup'); og.label = group;
      for (const n of names) { const o = document.createElement('option'); o.value = o.textContent = n; og.appendChild(o); }
      screenSel.appendChild(og);
    }
    for (const s of SIZES.concat('custom')) {
      const o = document.createElement('option'); o.value = s; o.textContent = s === 'custom' ? 'custom…' : s; sizeSel.appendChild(o);
    }
    // Modifiers: Auto (fixture default), None (force no banner), then every preset.
    [['', 'Auto (fixture default)'], ['none', 'None']].concat(
      Object.entries(PRESET_MODIFIERS).map(([k, v]) => [k, `${v.title} · ${k}`])
    ).forEach(([val, label]) => { const o = document.createElement('option'); o.value = val; o.textContent = label; modSel.appendChild(o); });

    // ── State <-> URL (so a live-reload restores the toolbar) ────────────────
    function readState() {
      const q = new URLSearchParams(location.search);
      return {
        fixture: q.get('fixture') || screenSel.options[0]?.value || 'intro',
        size: q.get('size') || '1280x800',
        mod: q.get('mod') ?? '',
        gallery: q.get('gallery') === '1',
        sizes: q.get('sizes') === '1',
      };
    }
    function writeState(st) {
      const q = new URLSearchParams();
      q.set('fixture', st.fixture); q.set('size', st.size); if (st.mod) q.set('mod', st.mod);
      if (st.gallery) q.set('gallery', '1'); if (st.sizes) q.set('sizes', '1');
      history.replaceState(null, '', '?' + q.toString());
    }

    function currentSize() {
      if (sizeSel.value === 'custom') return `${Math.max(240, +cw.value || 360)}x${Math.max(320, +ch.value || 780)}`;
      return sizeSel.value;
    }
    function frameURL(fixture, size, mod) {
      const q = new URLSearchParams({ fixture, size });
      if (mod) q.set('mod', mod);
      return 'frame.html?' + q.toString(); // relative to this page (/lab/) — works served or via file://
    }

    // A sized box with a scale-to-fit iframe. The iframe's width/height attributes stay W×H so CSS
    // media queries fire at the real breakpoints; a CSS transform shrinks it to fit `maxW`/`maxH`.
    function makeFrameBox(fixture, size, mod, maxW, maxH, showTag) {
      const [w, h] = size.split('x').map(Number);
      const scale = Math.min(1, maxW / w, maxH ? maxH / h : 1);
      const box = document.createElement('div');
      box.className = 'frame-box';
      box.style.width = (w * scale) + 'px';
      box.style.height = (h * scale) + 'px';
      const ifr = document.createElement('iframe');
      ifr.src = frameURL(fixture, size, mod);
      ifr.width = w; ifr.height = h;
      ifr.style.width = w + 'px'; ifr.style.height = h + 'px';
      ifr.style.transform = `scale(${scale})`;
      box.appendChild(ifr);
      if (showTag) { const t = document.createElement('div'); t.className = 'size-tag'; t.textContent = `${size}${scale < 1 ? ` · ${Math.round(scale * 100)}%` : ''}`; box.appendChild(t); }
      return box;
    }

    // ── Render the stage from state ──────────────────────────────────────────
    // Build a captioned grid of frames into the stage.
    function renderGrid(cells, cls, cols) {
      const grid = document.createElement('div'); grid.id = 'gallery';
      if (cls) grid.className = cls;
      if (cols) grid.style.gridTemplateColumns = cols;
      for (const [caption, box] of cells) {
        const cell = document.createElement('div'); cell.className = 'cell';
        const cap = document.createElement('div'); cap.className = 'cap'; cap.textContent = caption;
        cell.appendChild(cap); cell.appendChild(box);
        grid.appendChild(cell);
      }
      stage.appendChild(grid);
    }

    function render() {
      const st = { fixture: screenSel.value, size: currentSize(), mod: modSel.value, gallery: galleryCb.checked, sizes: sizesCb.checked };
      writeState(st);
      custom.classList.toggle('hidden', sizeSel.value !== 'custom');
      stage.innerHTML = '';
      if (st.sizes) {
        // THIS Screen at every binding size — caption is the size. Fit ALL frames into the visible
        // stage with no scrolling, as large as possible: try every column count and keep the one whose
        // equal cells maximise total rendered frame area, then scale each frame to fit its cell
        // (preserving aspect). Computed from the live stage size, so it re-fits on window resize.
        const stageW = stage.clientWidth - 36, stageH = stage.clientHeight - 36;
        const N = SIZES.length, GAP = 16, CAP = 20; // grid gap; per-cell caption height
        const dims = SIZES.map(s => s.split('x').map(Number));
        let best = null;
        for (let C = 1; C <= N; C++) {
          const R = Math.ceil(N / C);
          const cellW = (stageW - GAP * (C - 1)) / C;
          const cellH = (stageH - GAP * (R - 1) - CAP * R) / R;
          if (cellW < 80 || cellH < 80) continue;
          let area = 0;
          for (const [w, h] of dims) { const s = Math.min(1, cellW / w, cellH / h); area += w * h * s * s; }
          if (!best || area > best.area) best = { C, cellW, cellH, area };
        }
        best ||= { C: 3, cellW: (stageW - GAP * 2) / 3, cellH: (stageH - GAP * 2 - CAP * 3) / 3 };
        renderGrid(
          SIZES.map(size => [size, makeFrameBox(st.fixture, size, st.mod, best.cellW, best.cellH, false)]),
          'fit', `repeat(${best.C}, ${best.cellW}px)`
        );
      } else if (st.gallery) {
        // EVERY Screen at the chosen size — caption is the Screen name.
        renderGrid(Object.keys(SCREEN_FIXTURES).map(name => [name, makeFrameBox(name, st.size, st.mod, 300, 0, false)]));
      } else {
        // Fit the single frame to the stage with a little breathing room.
        const maxW = stage.clientWidth - 36, maxH = stage.clientHeight - 36;
        stage.appendChild(makeFrameBox(st.fixture, st.size, st.mod, maxW, maxH, true));
      }
    }

    // ── Wire up ──────────────────────────────────────────────────────────────
    const st0 = readState();
    screenSel.value = st0.fixture;
    if (SIZES.includes(st0.size)) sizeSel.value = st0.size;
    else { sizeSel.value = 'custom'; const [w, h] = st0.size.split('x'); cw.value = w; ch.value = h; }
    modSel.value = st0.mod;
    galleryCb.checked = st0.gallery && !st0.sizes;
    sizesCb.checked = st0.sizes;

    // The two gallery modes are mutually exclusive — ticking one unticks the other.
    galleryCb.addEventListener('change', () => { if (galleryCb.checked) sizesCb.checked = false; });
    sizesCb.addEventListener('change', () => { if (sizesCb.checked) galleryCb.checked = false; });

    [screenSel, sizeSel, modSel, galleryCb, sizesCb, cw, ch].forEach(el => el.addEventListener('change', render));
    [cw, ch].forEach(el => el.addEventListener('input', () => { if (sizeSel.value === 'custom') render(); }));
    // The single-frame view and the All-sizes fit-grid both scale to the window; the Gallery uses
    // fixed thumbnails (no re-fit). All-sizes is debounced since re-rendering reloads its iframes.
    let _rz;
    window.addEventListener('resize', () => {
      if (galleryCb.checked) return;
      if (sizesCb.checked) { clearTimeout(_rz); _rz = setTimeout(render, 150); }
      else render();
    });
    render();
  </script>
</body>
</html>

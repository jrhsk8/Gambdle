<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>♣ Gambdle Layout Tests</title>
  <!-- Real game stylesheet — required so CSS media queries fire at the correct breakpoints -->
  <link rel="stylesheet" href="../styles.css">
  <style>
    /* Real game font, self-hosted (latin subset, SIL OFL — see assets/VT323-OFL.txt) instead of the
       Google Fonts CDN. Text sizing must use VT323's real metrics, and the CDN load is an async race
       that intermittently left a measurement on the wider Courier-New fallback (the bj-result-split-3-gap
       flake). Local + the deferred run below (waits for fonts.ready) make every measurement deterministic
       and the suite fully offline. font-display:block so nothing is ever measured mid-swap. */
    @font-face {
      font-family: 'VT323';
      font-style: normal;
      font-weight: 400;
      font-display: block;
      src: url('../assets/vt323-latin.woff2') format('woff2');
    }
    /* Test output overlay — position:fixed so it has zero effect on document flow/height */
    #test-overlay {
      position: fixed; bottom: 8px; right: 8px; z-index: 9999;
      background: rgba(0,0,0,.82); color: #ccc;
      font-family: monospace; font-size: 11px; line-height: 1.4;
      padding: 8px 12px; border-radius: 4px;
      max-width: 300px; max-height: 50vh; overflow-y: auto;
      pointer-events: none;
    }
    #summary { font-weight: bold; margin-bottom: 4px; }
    .section-name { color: #aaa; font-size: 10px; text-transform: uppercase; }
    .group-name   { color: #777; }
    .fail-msg     { color: #c44; }
    .fail-err     { color: #888; font-size: 10px; display: block; margin-top: 1px; }
    .cnt-pass     { color: #4a9; }
    .cnt-fail     { color: #c44; }
  </style>
</head>
<body>
  <!-- Game renders here — must be visible for real layout measurements -->
  <div id="app"></div>
  <div id="toast"></div>
  <div id="xp-balloon"></div>

  <!-- Fixed test output overlay — does not affect document flow -->
  <div id="test-overlay">
    <div id="summary">Running…</div>
    <div id="groups-grid"></div>
  </div>

  <script>
    // Mark this as the unit-test harness so _testActive() honours the test-seed flag here
    // (the real game only honours it in dev mode, ?dev=true).
    window.__GAMBDLE_TEST__ = true;
    try {
      localStorage.removeItem('gambdle_dev_game1');
      localStorage.removeItem('gambdle_dev_game2');
    } catch(e) {}
  </script>

  <script src="../src/modifiers.js"></script>
  <script src="../src/icons.js"></script>
  <script src="../src/core.js"></script>
  <script src="../src/net.js"></script>
  <script src="../src/deal.js"></script>
  <script src="../src/record.js"></script>
  <script src="../src/dom-ids.js"></script>
  <script src="../src/bet.js"></script>
  <script src="../src/gametext.js"></script>
  <script src="../src/audio.js"></script>
  <script src="../src/uth.js"></script>
  <script src="../src/poker.js"></script>
  <script src="../src/roulette.js"></script>
  <script src="../src/ladder.js"></script>
  <script src="../src/bj.js"></script>
  <script src="../src/ui.js"></script>
  <script src="../src/windows.js"></script>
  <script src="../src/menus.js"></script>
  <script src="../src/dev.js"></script>
  <script src="../src/screens.js"></script>
  <script src="../src/flow.js"></script>
  <script src="../src/seedcheck.js"></script>
  <script src="../src/game.js"></script>

  <!-- Shared measurement core + Fixture registry — loaded after the game so they can read
       the live DOM and reference S/card()/render(). Both feed the Layout DSL (layout-dsl.js). -->
  <script src="layout-measure.js"></script>
  <script src="screen-fixtures.js"></script>

  <script>
    window._testReloadCount = 0;
    _doReload = function() { window._testReloadCount++; };

    // Tests must NEVER hit the network — see the matching note in test.html. render() of the
    // results screen fires live Supabase reads; stub fetch so the layout run stays fully offline.
    // The chart fixtures draw synchronously via _showHistoryChart/_renderScoreDist regardless.
    window.fetch = () => Promise.resolve({
      ok: false, status: 0,
      json: () => Promise.resolve(null),
      text: () => Promise.resolve(''),
      headers: { get: () => null },
    });
  </script>

  <script src="runner.js"></script>
  <script src="layout-dsl.js"></script>

  <!-- Defer the layout test BODIES until VT323 has loaded AND applied, so every fixture is measured with
       the real pixel-font metrics rather than the wider Courier-New fallback. The test files call
       describe()/expectLayout() at parse time (render → measure, interleaved per fixture), so the only
       place to gate is before they run. The font is self-hosted (no network) so fonts.ready resolves
       immediately — this adds no meaningful time. runner.js skips its own on-load render (__DEFER_RENDER__)
       and we call _renderResults() once the deferred tests have populated the results. -->
  <script>
    window.__DEFER_RENDER__ = true;
    window.addEventListener('load', async () => {
      try {
        try { await document.fonts.load('1em "VT323"'); } catch (e) {}
        try { await document.fonts.ready; } catch (e) {}
        for (const f of ['layout.test.js', 'layout-balloon.test.js', 'layout-dsl.test.js']) {
          await new Promise((resolve, reject) => {
            const s = document.createElement('script');
            s.src = f; s.onload = resolve; s.onerror = () => reject(new Error('failed to load ' + f));
            document.body.appendChild(s);
          });
        }
      } finally {
        _renderResults(); // always populate #summary so the CLI runner never hangs on the wait
      }
    });
  </script>
</body>
</html>
